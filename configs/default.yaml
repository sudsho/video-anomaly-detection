# default training / inference config
seed: 42

data:
  # loader expects `root` to contain per-video frame folders directly,
  # so point at the Train (or Test) split rather than the dataset root.
  root: data/raw/UCSD_Anomaly_Dataset/UCSDped2/Train
  clip_len: 16
  stride: 8
  img_size: 112
  num_workers: 4

model:
  arch: c3d            # c3d | i3d | autoencoder
  num_classes: 2       # normal / anomaly for supervised

train:
  batch_size: 16
  epochs: 30
  lr: 3.0e-4
  weight_decay: 5.0e-5
  optimizer: adamw
  amp: true
  log_interval: 20
  ckpt_dir: checkpoints
  scheduler: cosine

eval:
  agg: max          # how to aggregate clip score to frame score

infer:
  device: cuda
  threshold: 0.6

mlflow:
  experiment: video-anomaly
  tracking_uri: file:./mlruns
