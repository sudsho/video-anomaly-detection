[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-anomaly-detection"
version = "0.1.0"
description = "Surveillance-grade video anomaly detection with 3D CNNs, low-latency inference."
authors = [{name = "Sudhanshu Srivastava"}]
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
